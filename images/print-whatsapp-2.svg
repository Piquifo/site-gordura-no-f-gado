<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 590" width="100%" height="100%" style="background:#ECE5DD;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="av2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Top Bar WhatsApp -->
  <rect x="0" y="0" width="420" height="74" fill="#075E54"/>
  
  <path d="M16 38 L26 28 M16 38 L26 48 M16 38 L34 38" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  
  <circle cx="56" cy="38" r="20" fill="url(#av2)"/>
  <text x="56" y="44" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle">MV</text>
  
  <text x="88" y="34" fill="#FFFFFF" font-size="16" font-weight="600">Marcos Vinícius</text>
  <text x="88" y="50" fill="#A7F3D0" font-size="12">online</text>
  
  <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="300" y="28" width="18" height="14" rx="3"/>
    <path d="M318 33 L326 29 L326 41 Z"/>
    <path d="M346 31 C346 37 351 42 357 42 C359 42 360 41 361 40 L359 36 L356 37 C354 35 353 34 351 32 L352 29 L348 27 C347 28 346 29 346 31 Z"/>
    <circle cx="388" cy="31" r="1.5" fill="#FFFFFF"/>
    <circle cx="388" cy="38" r="1.5" fill="#FFFFFF"/>
    <circle cx="388" cy="45" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Date Chip -->
  <rect x="175" y="90" width="70" height="24" rx="12" fill="#E1F3FB" filter="url(#shadow2)"/>
  <text x="210" y="106" fill="#54656F" font-size="11" font-weight="600" text-anchor="middle">Ontem</text>

  <!-- Message 1 (Incoming) -->
  <rect x="25" y="128" width="345" height="114" rx="10" fill="#FFFFFF" filter="url(#shadow2)"/>
  <text x="38" y="150" fill="#111B21" font-size="13.5">Bom dia Dr.! Queria deixar meu relato</text>
  <text x="38" y="170" fill="#111B21" font-size="13.5">porque prometi pra mim mesmo que se</text>
  <text x="38" y="190" fill="#0D6E44" font-size="13.5" font-weight="700">meus exames baixassem eu vinha falar.</text>
  <text x="38" y="212" fill="#111B21" font-size="13.5">Olha os resultados que saíram hoje:</text>
  <text x="334" y="234" fill="#667781" font-size="10.5">09:15</text>

  <!-- Message 2 (Exams highlight) -->
  <rect x="25" y="252" width="345" height="120" rx="10" fill="#FFFFFF" filter="url(#shadow2)"/>
  <text x="38" y="274" fill="#111B21" font-size="13.5">🧪 <tspan font-weight="700">TGO:</tspan> caiu de 84 U/L para <tspan fill="#0D6E44" font-weight="700">26 U/L</tspan></text>
  <text x="38" y="296" fill="#111B21" font-size="13.5">🧪 <tspan font-weight="700">TGP:</tspan> caiu de 92 U/L para <tspan fill="#0D6E44" font-weight="700">29 U/L</tspan></text>
  <text x="38" y="318" fill="#111B21" font-size="13.5">🧪 <tspan font-weight="700">GGT:</tspan> normalizou completamente!</text>
  <text x="38" y="342" fill="#111B21" font-size="13.5">Tudo dentro dos padrões saudáveis.</text>
  <text x="38" y="360" fill="#111B21" font-size="13.5">Eliminei 5,5 kg sem passar fome nenhuma!</text>
  <text x="334" y="364" fill="#667781" font-size="10.5">09:16</text>

  <!-- Message 3 (Outgoing) -->
  <rect x="110" y="384" width="285" height="74" rx="10" fill="#D9FDD3" filter="url(#shadow2)"/>
  <text x="122" y="406" fill="#111B21" font-size="13.5">Que espetáculo de resultado, Marcos!</text>
  <text x="122" y="426" fill="#111B21" font-size="13.5">TGO e TGP normalizados mostram que a</text>
  <text x="122" y="446" fill="#111B21" font-size="13.5">inflamação do fígado zerou. Parabéns! 👏</text>
  <text x="352" y="452" fill="#667781" font-size="10.5">09:18</text>
  <path d="M375 446 L378 450 L386 441 M379 446 L382 450 L390 441" stroke="#53BDEB" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Message 4 (Incoming) -->
  <rect x="25" y="470" width="345" height="72" rx="10" fill="#FFFFFF" filter="url(#shadow2)"/>
  <text x="38" y="492" fill="#111B21" font-size="13.5">Os exercícios de 10 min em casa cabem</text>
  <text x="38" y="512" fill="#111B21" font-size="13.5">perfeito na minha rotina. Recomendo pra</text>
  <text x="38" y="530" fill="#111B21" font-size="13.5">todo mundo que tem medo de cirrose. 👊</text>
  <text x="334" y="534" fill="#667781" font-size="10.5">09:20</text>
</svg>